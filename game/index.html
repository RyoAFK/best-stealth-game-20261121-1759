<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUSHFALL — a tiny stealth caper</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e16; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 864px); height: auto; aspect-ratio: 864 / 584; background: #10131d; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="864" height="584" aria-label="HUSHFALL: sneak past the wardens, lift every gem and reach the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
